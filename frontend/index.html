<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Compliance Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mini Compliance Tracker</h1>
      <p>Track client compliance tasks and highlight overdue items.</p>
    </header>

    <main>
      <section class="panel clients-panel">
        <h2>Clients</h2>
        <ul id="client-list"></ul>

        <h3>Add Client</h3>
        <form id="client-form" class="client-form">
          <label>
            Company Name
            <input name="company_name" type="text" required />
          </label>

          <label>
            Country
            <input name="country" type="text" required />
          </label>

          <label>
            Entity Type
            <input name="entity_type" type="text" placeholder="LLC, Pvt Ltd, Inc" required />
          </label>

          <button type="submit">Add Client</button>
        </form>
        <p id="client-form-message" class="message"></p>
      </section>

      <section class="panel tasks-panel">
        <div class="tasks-header">
          <h2 id="selected-client">Select a client</h2>
          <div id="summary" class="summary"></div>
        </div>

        <div class="filters">
          <label>
            Status
            <select id="status-filter">
              <option value="">All</option>
              <option value="Pending">Pending</option>
              <option value="Completed">Completed</option>
            </select>
          </label>

          <label>
            Category
            <select id="category-filter">
              <option value="">All</option>
            </select>
          </label>

          <label>
            Sort By
            <select id="sort-filter">
              <option value="due_date:asc">Due Date (Earliest)</option>
              <option value="due_date:desc">Due Date (Latest)</option>
              <option value="priority:desc">Priority (High to Low)</option>
              <option value="priority:asc">Priority (Low to High)</option>
              <option value="title:asc">Title (A-Z)</option>
            </select>
          </label>

          <label class="search-label">
            Search
            <input id="search-filter" type="text" placeholder="Search title, description, category" />
          </label>
        </div>

        <div id="task-list" class="task-list"></div>
      </section>

      <section class="panel form-panel">
        <h2>Add Task</h2>
        <form id="task-form">
          <label>
            Title
            <input name="title" type="text" required />
          </label>

          <label>
            Description
            <textarea name="description" rows="3"></textarea>
          </label>

          <label>
            Category
            <input name="category" type="text" required />
          </label>

          <label>
            Due Date
            <input name="due_date" type="date" required />
          </label>

          <label>
            Priority
            <select name="priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </label>

          <button type="submit">Add Task</button>
        </form>

        <p id="form-message" class="message"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
